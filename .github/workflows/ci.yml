name: build

on:
  push:
  pull_request:

jobs:
  windows:
    # windows-latest 已迁移到 windows-2025-vs2026，CMake 找不到 VS 2022。
    # 显式钉住 2022 镜像，保证 "Visual Studio 17 2022" 生成器可用。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release